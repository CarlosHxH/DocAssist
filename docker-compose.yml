# Ambiente padrão: sobe apenas o DocAssist, usando uma API de IA externa ao compose
# (Ollama rodando no host, OpenAI, LM Studio, vLLM...).
#   docker compose up -d --build
# Para subir também um Ollama em container, use o ambiente local:
#   docker compose -f docker-compose.local.yml up -d --build
services:
  app:
    build: .
    # Provedor, URL, chave e modelos vêm do .env. Se LLM_API_URL apontar para localhost
    # (ex.: Ollama no host), defina LLM_API_URL_DOCKER=http://host.docker.internal:11434,
    # pois localhost dentro do container é o próprio container.
    env_file:
      - path: .env
        required: false
    environment:
      LLM_API_URL: ${LLM_API_URL_DOCKER:-${LLM_API_URL:-http://host.docker.internal:11434}}
      CHROMA_PATH: /app/chroma_db
      PORT: "8765"
    # Faz host.docker.internal resolver para o host também no Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8765:8765"
    volumes:
      - ./logs:/app/logs
      - chroma_data:/app/chroma_db
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8765/api/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  chroma_data:
