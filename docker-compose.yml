services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Para usar GPU NVIDIA (opcional — requer o NVIDIA Container Toolkit no host),
    # descomente o bloco abaixo:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Serviço que roda uma vez, baixa os dois modelos usados pelo DocAssist e encerra.
  # O `app` só inicia depois que este passo termina com sucesso (ver depends_on abaixo).
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm}
      GENERATION_MODEL: ${GENERATION_MODEL:-qwen2.5:3b}
    entrypoint: ["sh", "-c", "ollama pull $${EMBEDDING_MODEL:-all-minilm} && ollama pull $${GENERATION_MODEL:-qwen2.5:3b}"]
    restart: "no"

  app:
    build: .
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    # Modelos, provedor, chave etc. vêm do .env; a URL da API aponta para o container
    # do Ollama, a menos que LLM_API_URL_DOCKER seja definida.
    env_file:
      - path: .env
        required: false
    environment:
      LLM_API_URL: ${LLM_API_URL_DOCKER:-http://ollama:11434}
      CHROMA_PATH: /app/chroma_db
      PORT: "8765"
    ports:
      - "8765:8765"
    volumes:
      - ./logs:/app/logs
      - chroma_data:/app/chroma_db
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8765/api/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ollama_data:
  chroma_data:
